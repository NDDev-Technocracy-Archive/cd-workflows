name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: source-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: static validators
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Prepare source tooling
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@c09f5939b8ca3ef1ddf72d825ff01d751e649292 # v0.6.60
        with:
          managed: 'false'
          fetch-depth: '0'
          python-version: '3.15.2'
          tools: zizmor@1.32.0,shellcheck@0.11.0
          tool-assets: tools/ci-tools.json
      - name: Run source and actual unit/provenance contracts
        id: project
        run: just verify
      - name: Complete the contract checks
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@c09f5939b8ca3ef1ddf72d825ff01d751e649292 # v0.6.60
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: source and native contracts
          name: contract-checks

  merge-stops:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@c09f5939b8ca3ef1ddf72d825ff01d751e649292 # v0.6.60
    permissions:
      contents: read

  test:
    name: test
    needs: [validate, merge-stops]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require actual native contracts and security success
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          STOPS_RESULT: ${{ needs.merge-stops.result }}
        run: test "$VALIDATE_RESULT" = success && test "$STOPS_RESULT" = success
