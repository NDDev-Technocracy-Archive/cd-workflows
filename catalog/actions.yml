# Every third-party action this module pins, and the release each SHA is.
#
# The pin is the SHA; the comment beside it is the only thing a human or
# Dependabot reads to know which release that is. When they disagree the
# comment wins in every review and loses in every run.
#
# They did disagree: fifteen checkout pins carried `# v5.0.0` while the SHA
# was v7.0.1 -- two majors apart, on a module that deploys the fleet. Nothing
# in this repository compared them, so the label drifted from the day it was
# written.
#
# `scripts/validate_module.sh` now holds every `uses:` in .github/ to this
# table, so a bump has to change one reviewed place rather than fifteen
# unreviewed comments.
